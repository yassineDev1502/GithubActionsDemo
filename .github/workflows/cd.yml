name: CD - Deploy to Azure App Service

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: forgithub
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore GithubActionsDemo.sln

      - name: Build
        run: dotnet build GithubActionsDemo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GithubActionsDemo.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish GithubActionsDemo.Web.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish